<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0713;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .banner-container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .banner-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <!-- Direkta nga gipasukad sa banner.png -->
        <img src="banner.png" alt="Source Shop Banner">
    </div>
</body>
</html>
