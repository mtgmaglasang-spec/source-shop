<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Shop</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0713;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .center-box {
            text-align: center;
        }
        img {
            max-width: 500px;
            width: 90%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="center-box">
        <!-- Sulayi ang banner.png, kung wala mo-load, usba ang file name sa GitHub -->
        <img src="banner.png" alt="Source Shop Banner" onerror="this.src='https://raw.githubusercontent.com/MarcuForce/source-shop/main/banner.png';">
    </div>
</body>
</html>
